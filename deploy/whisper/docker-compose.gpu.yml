services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: komfyedit-whisper-gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Default model: Systran/faster-whisper-small (balance between speed and accuracy)
      # Alternatives: Systran/faster-whisper-base, Systran/faster-whisper-medium, Systran/faster-whisper-large-v3
      - WHISPER_MODEL=Systran/faster-whisper-small
      - WHISPER_BEAM_SIZE=5
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  huggingface-cache:
    name: komfyedit-whisper-cache
